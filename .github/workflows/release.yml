name: Package release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  dmg:
    needs: ci
    runs-on: macos-26
    timeout-minutes: 45
    outputs:
      notarized: ${{ steps.package.outputs.notarized }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag and architecture
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$(uname -m)" == arm64 ]]
          grep -Fq 'VERSION="${VERSION:-'"${GITHUB_REF_NAME#v}"'}"' macos/script/package_dmg.sh
      - name: Build and verify distribution image
        id: package
        env:
          DEVELOPER_ID_APP: ${{ secrets.DEVELOPER_ID_APP }}
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          ./macos/script/ci_package.sh
          if [[ -n "$DEVELOPER_ID_APP" ]]; then
            echo "notarized=true" >> "$GITHUB_OUTPUT"
          else
            echo "notarized=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: FizzDeck-${{ github.ref_name }}-arm64
          path: |
            macos/dist/*.dmg
            macos/dist/*.sha256
          if-no-files-found: error
  draft:
    needs: dmg
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs/releases
      - uses: actions/download-artifact@v4
        with:
          name: FizzDeck-${{ github.ref_name }}-arm64
      - name: Verify and upload both assets to a draft
        env:
          GH_TOKEN: ${{ github.token }}
          NOTARIZED: ${{ needs.dmg.outputs.notarized }}
        run: |
          file="FizzDeck-${GITHUB_REF_NAME#v}-arm64.dmg"
          sha256sum -c "$file.sha256"
          notes="$RUNNER_TEMP/release-notes.md"
          : > "$notes"
          if [[ -f "docs/releases/$GITHUB_REF_NAME.md" ]]; then
            cat "docs/releases/$GITHUB_REF_NAME.md" >> "$notes"
          fi
          case "$NOTARIZED" in
            true) signing='Developer ID 签名，已通过 Apple 公证并附加公证票据。' ;;
            false) signing='ad-hoc 签名，无 Team ID，未经 Apple 公证。' ;;
            *) exit 1 ;;
          esac
          printf '\n**安装包签名：** %s\n' "$signing" >> "$notes"
          gh release create "$GITHUB_REF_NAME" "$file" "$file.sha256" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --notes-file "$notes" --generate-notes

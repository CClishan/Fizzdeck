<svg xmlns="http://www.w3.org/2000/svg" width="660" height="420" viewBox="0 0 660 420" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="660" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAF9F7"/>
      <stop offset="100%" stop-color="#F2F1EE"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(80 60) scale(340 240)">
      <stop offset="0%" stop-color="#FFA6AD" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FFA6AD" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(590 70) scale(340 260)">
      <stop offset="0%" stop-color="#6438FF" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#6438FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brandText" x1="255" y1="322" x2="345" y2="338" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6438FF"/>
      <stop offset="52%" stop-color="#D9468F"/>
      <stop offset="100%" stop-color="#FF7A59"/>
    </linearGradient>
  </defs>

  <rect width="660" height="420" fill="url(#bg)"/>
  <rect width="660" height="420" fill="url(#glowLeft)"/>
  <rect width="660" height="420" fill="url(#glowRight)"/>

  <!-- Subtle floating project-card fragments (no mascots) -->
  <g transform="translate(534 72) rotate(14)" opacity="0.65">
    <rect width="58" height="38" rx="9" fill="#FFFFFF" fill-opacity="0.82" stroke="#111315" stroke-opacity="0.08"/>
    <circle cx="13" cy="14" r="4" fill="#6438FF"/>
    <rect x="22" y="11" width="24" height="5" rx="2.5" fill="#111315" fill-opacity="0.14"/>
    <rect x="10" y="23" width="36" height="4" rx="2" fill="#111315" fill-opacity="0.08"/>
  </g>

  <g transform="translate(410 42) rotate(-10)" opacity="0.58">
    <rect width="52" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.78" stroke="#111315" stroke-opacity="0.08"/>
    <circle cx="12" cy="13" r="3.5" fill="#16A34A"/>
    <rect x="20" y="10.5" width="22" height="4.5" rx="2.25" fill="#111315" fill-opacity="0.13"/>
    <rect x="10" y="21" width="30" height="3.5" rx="1.75" fill="#111315" fill-opacity="0.08"/>
  </g>

  <g transform="translate(86 296) rotate(-13)" opacity="0.6">
    <rect width="54" height="35" rx="8.5" fill="#FFFFFF" fill-opacity="0.78" stroke="#111315" stroke-opacity="0.08"/>
    <circle cx="12" cy="13" r="3.5" fill="#F59E0B"/>
    <rect x="20" y="10.5" width="24" height="4.5" rx="2.25" fill="#111315" fill-opacity="0.13"/>
    <rect x="10" y="21" width="32" height="3.5" rx="1.75" fill="#111315" fill-opacity="0.08"/>
  </g>

  <!-- Dotted double-bounce arc from FizzDeck (180,196) to Applications (480,196) -->
  <path
    d="M 238 196 Q 284 134 330 212 Q 376 134 422 196"
    stroke="#111315"
    stroke-opacity="0.28"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-dasharray="2 7.5"
  />
  <!-- Radiating bounce ticks -->
  <g stroke="#111315" stroke-opacity="0.24" stroke-width="1.6" stroke-linecap="round">
    <line x1="330" y1="222" x2="330" y2="229"/>
    <line x1="322" y1="220" x2="318" y2="226"/>
    <line x1="338" y1="220" x2="342" y2="226"/>
  </g>

  <!-- Neutral mid-tone label capsules keep Finder labels legible in Light & Dark mode -->
  <rect x="118" y="256" width="124" height="24" rx="12" fill="#9E9BAA" fill-opacity="0.32"/>
  <rect x="418" y="256" width="124" height="24" rx="12" fill="#9E9BAA" fill-opacity="0.32"/>

  <!-- Headline -->
  <text x="330" y="336" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="20" font-weight="600" letter-spacing="-0.3">
    <tspan fill="#18191C">Drag </tspan>
    <tspan fill="url(#brandText)" font-weight="700">FizzDeck</tspan>
    <tspan fill="#18191C"> to Applications</tspan>
  </text>

  <!-- Gatekeeper hint -->
  <text x="330" y="364" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11.5" font-weight="400" fill="#18191C" fill-opacity="0.52">
    首次打开如提示未公证：右键 → 打开
  </text>
</svg>
